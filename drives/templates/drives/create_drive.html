{% extends "base.html" %}
{% block title %}Post a Drive &mdash; Rakt-Kosh{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Post a Donation Drive</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-danger w-100">Post Drive</button>
    </form>
  </div>
</div>
{% endblock %}
